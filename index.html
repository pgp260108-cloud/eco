<style>
/* Layout: pantalla completa de juego; HUD en esquina superior izquierda, tarjeta central en menús. */
:root{
  --bg:#03080c; --fg:#cfe9ee; --dim:#6f9099; --accent:#5fe3f0; --warn:#ff6a55; --gold:#ffd36a; --air:#7dffc0;
  --panel:rgba(4,12,17,.84); --line:rgba(95,227,240,.22);
  --display:'Unbounded',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
#hud,#overlay,#toast,#banner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;display:grid;gap:7px;pointer-events:none;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
#hud .row{display:flex;align-items:center;gap:10px;min-height:16px}
#hud .lab{width:84px}
#hud b{font-weight:500;color:var(--fg);letter-spacing:.06em}
.bar{width:120px;height:5px;background:rgba(95,227,240,.12);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:50%;background:var(--accent)}
.bar.noise i{background:var(--warn)}
.bar.low i{background:var(--warn)}
#hp{display:flex;gap:5px}
#hp span{width:14px;height:6px;background:var(--accent)}
#hp span.off{background:rgba(95,227,240,.14)}
#tools{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
#tools button{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:var(--panel);border:1px solid var(--line);padding:7px 10px;cursor:pointer}
#tools button:hover,#tools button:focus-visible{color:var(--fg);border-color:var(--accent);outline:none}
#toast{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);text-align:center;font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);pointer-events:none;opacity:0;transition:opacity .4s}
#toast.on{opacity:1}
#banner{position:fixed;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;opacity:0}
#banner.on{animation:bn 2s ease both}
#banner small{display:block;font:400 11px var(--mono);letter-spacing:.4em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
#banner strong{font:300 clamp(40px,10vw,88px)/1 var(--display);letter-spacing:.04em;color:var(--fg)}
@keyframes bn{0%{opacity:0}20%{opacity:1}75%{opacity:1}100%{opacity:0}}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(2,6,9,.72);overflow:auto;padding-block:24px}
#overlay[hidden]{display:none!important}
.card{max-width:560px;width:100%;background:var(--panel);border:1px solid var(--line);padding:28px clamp(18px,5vw,34px);display:grid;gap:16px}
.card h1{margin:0;font:300 clamp(46px,11vw,76px)/1 var(--display);letter-spacing:.12em;color:var(--fg)}
.card h2{margin:0;font:500 22px/1.2 var(--display);letter-spacing:.04em}
.card p{margin:0;font-size:14.5px;line-height:1.6;color:var(--fg);text-wrap:pretty;max-width:62ch}
.card .sub{font:400 11px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;color:var(--dim);margin:0}
.keys dt{font:500 12px var(--mono);color:var(--accent);white-space:nowrap}
.keys dd{margin:0}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:7px}.legend .ico{position:static;inset:auto;display:block;width:30px;height:30px;flex:none;background:none}
.dot{width:10px;height:10px;display:inline-block}
.btn{justify-self:start;font:500 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--bg);background:var(--accent);border:0;padding:13px 22px;cursor:pointer}

#touch{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:var(--c);height:var(--c);display:none;pointer-events:none}
#touch button{position:absolute;pointer-events:auto;display:grid;place-content:center;justify-items:center;gap:3px;padding:0;border-radius:50%;color:var(--accent);--g:95,227,240;border:1.5px solid rgba(var(--g),.5);background:radial-gradient(circle at 50% 36%,rgba(var(--g),.22),rgba(4,12,17,.85) 72%);box-shadow:0 0 16px rgba(var(--g),.14),inset 0 0 12px rgba(var(--g),.1);font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;touch-action:none;-webkit-tap-highlight-color:transparent;transition:transform .12s,box-shadow .2s,background .2s}
#touch button svg{width:calc(var(--c)*.15);height:calc(var(--c)*.15);fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

#touch button:active{transform:scale(.92);box-shadow:0 0 26px rgba(var(--g),.4),inset 0 0 16px rgba(var(--g),.25)}
#tSoft{width:48%;height:48%;left:50%;top:50%}

#tSoft::after{content:"";position:absolute;inset:-5%;border-radius:50%;border:1px solid rgba(95,227,240,.5);opacity:0;animation:tpulse 3.2s ease-out infinite;pointer-events:none}
@keyframes tpulse{0%{transform:scale(.92);opacity:.55}100%{transform:scale(1.3);opacity:0}}
#tLoud{width:33%;height:33%;left:17%;top:24%;color:#ff8a70;--g:255,106,85}
#tDecoy{width:33%;height:33%;left:12%;top:62%;color:var(--gold);--g:255,211,106}
#tSneak{width:33%;height:33%;left:56%;top:8%;color:#c9b0ff;--g:201,176,255}
#touch button.on{background:radial-gradient(circle at 50% 36%,rgba(var(--g),.55),rgba(4,12,17,.8) 78%);border-color:rgba(var(--g),.95);box-shadow:0 0 22px rgba(var(--g),.45),inset 0 0 14px rgba(var(--g),.3)}
:root{--c:min(212px,46vh,58vw)}
@media (pointer:coarse){#touch{display:block}#toast{bottom:calc(env(safe-area-inset-bottom,0px) + var(--c) + 30px)}}
@media (max-height:460px){#touch button span{display:none}}
/* Botones táctiles: solo visibles durante la partida (play/intro); ocultos en menús, pausa, fin y victoria */
body:not([data-s=play]):not([data-s=intro]) #touch{display:none!important}
@media (prefers-reduced-motion:reduce){#tSoft::after{animation:none}}
@media (max-width:520px){.bar{width:84px}#hud .lab{width:70px}}
@media (prefers-reduced-motion:reduce){#banner.on{animation-duration:.01s}}

/* ===== v2: menú, HUD y atmósfera ===== */
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 42%,rgba(0,0,0,.6) 100%)}
body[data-s=menu] #hud,body[data-s=menu] #toast,body[data-s=menu] #bPause{visibility:hidden}
#hud{gap:9px;padding:12px 22px 12px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(90deg,rgba(2,8,12,.72),transparent);font:12px var(--body);text-transform:none;letter-spacing:.02em}
#hud .lab{width:78px}
#hud .row:first-child{align-items:baseline}
#hud #depth{font:300 26px var(--display);letter-spacing:.02em}
#hud b{font-family:var(--mono)}
.bar{width:126px;height:6px;border-radius:3px;-webkit-mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 9px);mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 9px)}
.bar i{transition:width .25s}
.bar.low i{animation:lowp .7s ease-in-out infinite alternate}
@keyframes lowp{to{opacity:.3}}
#hp span{border-radius:2px;transition:background .3s}
#tools button{width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center;transition:color .2s,border-color .2s}
#tools svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#bMute:not(.off) .x,#bMute.off .w{display:none}
#bMute.off{color:var(--warn)}
#overlay{place-items:center start;padding-left:clamp(22px,7vw,110px);touch-action:pan-y;background:linear-gradient(90deg,rgba(2,6,9,.95) 0,rgba(2,6,9,.8) 40%,rgba(2,6,9,.1) 100%)}
#overlay[data-kind=pause],#overlay[data-kind=dead],#overlay[data-kind=tutend]{background:rgba(2,6,9,.84)}
@media(max-width:760px){#overlay{background:rgba(2,6,9,.86)!important}}
.card{background:none;border:0;padding:0;max-width:480px;gap:16px}
.card .sub{font:500 13px var(--body);letter-spacing:.04em;text-transform:none;color:var(--accent)}
.card h1{font-size:clamp(68px,15vw,136px);letter-spacing:.08em;line-height:.9;margin-left:-.04em}
.card h2{font-size:clamp(22px,4vw,28px)}
.o{position:relative;display:inline-block}
.o::before,.o::after{content:"";position:absolute;left:50%;top:52%;width:.6em;height:.6em;margin:-.3em 0 0 -.3em;border:1.5px solid var(--accent);border-radius:50%;opacity:0;animation:rip 5.5s ease-out infinite;pointer-events:none}
.o::after{animation-delay:.4s}
@keyframes rip{0%{transform:scale(.8);opacity:.75}55%,100%{transform:scale(5);opacity:0}}
.menu{display:grid;gap:0;margin:6px 0 4px}
.mi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:16px;padding:11px 0;font:400 17px var(--display);letter-spacing:.03em;color:var(--dim);transition:color .2s,padding-left .25s}

.mi:hover,.mi:focus-visible{color:var(--fg);padding-left:6px}

.mi.back{font-size:15px;margin-top:6px}
.set{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;font-size:14px}
.set output{font:400 12px var(--mono);color:var(--dim)}
.set input{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0 0 10px}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.chk input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.lnk{all:unset;cursor:pointer;justify-self:start;color:var(--dim);font-size:13px;text-decoration:underline}
.lnk:hover,.lnk:focus-visible{color:var(--fg)}
.card.wide{max-width:780px;width:min(780px,100%)}
.how{display:grid;gap:26px}
.how .lead{font-size:15px;color:var(--dim);max-width:58ch}
.how h3{margin:0 0 12px;display:flex;align-items:center;gap:12px;font:500 11px var(--mono);letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.how h3::after{content:"";flex:1;height:1px;background:var(--line)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;counter-reset:s}
.step{border:1px solid var(--line);background:rgba(95,227,240,.04);padding:13px 14px;display:grid;gap:6px;font-size:13px;line-height:1.5;color:var(--dim)}
.step b{display:flex;align-items:center;gap:10px;font:500 14.5px var(--display);color:var(--fg)}
.step b::before{counter-increment:s;content:counter(s);flex:none;display:grid;place-items:center;width:22px;height:22px;border:1.5px solid var(--accent);border-radius:50%;font:500 11px var(--mono);color:var(--accent)}
.keys2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px 22px}
.k2{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;font-size:13px;line-height:1.45;color:var(--dim)}
.kc{display:flex;gap:4px;flex-wrap:wrap}
.kc kbd{font:500 11px var(--mono);color:var(--fg);background:rgba(95,227,240,.08);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:3px 7px;min-width:24px;text-align:center}
.kc em{font:400 11px var(--mono);color:var(--dim);align-self:center;font-style:normal}
.mobnote{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px 12px;border:1px dashed var(--line);font-size:13px;line-height:1.5;color:var(--dim)}
.mobnote svg{flex:none;width:26px;height:26px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.it{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);background:rgba(95,227,240,.03)}
.it.foe{border-color:rgba(255,106,85,.32);background:rgba(255,106,85,.04)}
.it .ico{flex:none;width:36px;height:36px;display:block;position:static;inset:auto;background:none}
.it b{display:block;margin-bottom:2px;font:500 14px var(--display);color:var(--fg)}
.it span{font-size:12.5px;line-height:1.5;color:var(--dim)}
.dp{list-style:none;margin:0;padding:0;display:grid;gap:0;border-left:1px solid var(--line)}

.dp li::before{content:"";position:absolute;left:-4px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--bg);border:1.5px solid var(--accent)}
.dp b{font:500 12px var(--mono);color:var(--accent);letter-spacing:.06em;padding-top:1px}
.tip{border-left:2px solid var(--accent);padding:6px 0 6px 14px;font-size:13.5px;line-height:1.55;color:var(--fg)}
@media(max-width:520px){.keys2{grid-template-columns:1fr}.k2{grid-template-columns:92px 1fr}}
@media(prefers-reduced-motion:reduce){.o::before,.o::after,.bar.low i{animation:none}}
</style>

<style>

#tut b{font:500 15px var(--display);color:var(--fg)}#tut p{margin:0}#tut p b{font:500 13px var(--body);color:var(--fg)}

#tut kbd{font:500 11px var(--mono);color:var(--fg);background:rgba(95,227,240,.08);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;margin:0 1px}
#tut .tb{display:block;height:3px;background:rgba(95,227,240,.14)}#tut .tb u{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

@media(max-width:900px){#tut{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:14px;transform:none;width:min(420px,calc(100vw - var(--c) - 40px));min-width:0}}
</style>
<style>
#overlay{display:flex!important;align-items:flex-start}
#overlay[hidden]{display:none!important}
.card{margin:auto auto auto 0}
#tut{pointer-events:none}#tExit{pointer-events:auto}
#rot{display:none;position:fixed;inset:0;z-index:1000;background:#03080c;color:#cfe9ee;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;font:500 17px var(--display)}
#rot svg{width:84px;height:84px;fill:none;stroke:#5fe3f0;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;animation:rotp 2.6s ease-in-out infinite}
#rot small{font:400 13px var(--body);color:var(--dim);max-width:30ch;line-height:1.5}
@keyframes rotp{0%,25%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse) and (max-width:600px){#rot{display:flex}}

@media (max-height:460px){#hud{gap:4px;padding-top:6px;padding-bottom:6px}#hud #depth{font-size:20px}#hud .row{min-height:14px}.bar{width:84px}.card{gap:9px}.card h1{font-size:clamp(44px,9vw,72px)}.card p{font-size:13px;line-height:1.45}.mi{padding:6px 0}.mi.pri{padding:8px 0;font-size:20px}#tut{font-size:12px;padding:8px 10px;gap:4px}}
/* ===== Cuentas ===== */
.acc{display:grid;gap:14px}.acc form{display:grid;gap:16px}
.fld{display:grid;gap:4px}
.fld span{font:500 11px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.fld input{all:unset;box-sizing:border-box;width:100%;padding:9px 2px;font:400 16px var(--body);color:var(--fg);border-bottom:1px solid var(--line);transition:border-color .2s,box-shadow .2s;-webkit-user-select:text;user-select:text}
.fld input:focus{border-color:var(--accent);box-shadow:0 1px 0 var(--accent)}
.fld input::placeholder{color:rgba(111,144,153,.5)}

.lnk.w{color:var(--warn)}
/* ===== Clasificación ===== */
.lb{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--line)}

.lb .rk{font:500 12px var(--mono);letter-spacing:.08em;color:var(--dim)}
.lb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .sc{font:400 14px var(--mono);color:var(--accent)}
.lb li:nth-child(1) .rk,.lb li:nth-child(1) .sc{color:var(--gold)}
.lb li:nth-child(2) .rk,.lb li:nth-child(3) .rk{color:var(--fg)}
.lb li.me{background:rgba(95,227,240,.08);box-shadow:inset 2px 0 0 var(--accent)}
.lb li.me .nm{color:var(--fg);font-weight:600}
.lb li.gap{display:block;padding:2px 6px;text-align:center;color:var(--dim);border-bottom:0;letter-spacing:.4em}
.lbn{margin:0;font-size:13px;color:var(--dim)}
#touch #tAlert{display:none;width:27%;height:27%;left:72%;top:64%;color:#ffbe50;--g:255,190,80}
body[data-coop] #touch #tAlert{display:grid}
#team{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;max-width:46vw;pointer-events:none;font:11px var(--mono);letter-spacing:.04em;color:var(--dim)}
#team .tm{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

#team .tm b{font-weight:500;color:var(--warn)}
#team .tm.x{opacity:.45}#team .tm.d i{background:var(--warn);box-shadow:0 0 8px var(--warn)}

<div class="step"><b>Lanza un ping</b>Cada pulso ilumina un momento las paredes y lo que hay a tu alrededor.</div>
<div class="step"><b>Encuentra el faro</b>Zumba: con auriculares sabrás de qué lado está.</div>
<div class="step"><b>Sal a tiempo</b>Llega a él antes de quedarte sin aire y baja al siguiente tramo.</div></div></section>
<section><h3>Controles</h3><div class="keys2">
${kb(['W','A','S','D'],'Nadar (también con las flechas)')}
${kb(['Espacio','/','clic'],'Ping suave: alcance corto, poco ruido')}
${kb(['E','/','clic der.'],'Ping fuerte: largo alcance, mucho ruido, gasta más aire')}
${kb(['F'],'Señuelo: lanza un ruido lejos para distraer')}
${kb(['Shift'],'Sigilo: lento, silencioso, respiras menos')}
${kb(['M','/','Esc'],'Silenciar · menú')}</div>
<div class="mobnote"><svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0 0V8.5a1.5 1.5 0 0 1 3 0V11m0 0v-.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-.5a6 6 0 0 1-4.7-2.3L4 15.5a1.5 1.5 0 0 1 2.3-1.9L9 16"/></svg><span>En móvil: arrastra el dedo por la parte izquierda para nadar. A la derecha tienes Ping, Fuerte, Señuelo y Sigilo (este se activa y se desactiva al tocarlo).</span></div></section>
<section><h3>Peligros</h3><div class="items">
${it('c0','Oidor','Oye tus pings. Lanza el ping fuerte con cuidado.',1)}
${it('c1','Rastreador','Oye tus brazadas: cerca de él, nada despacio o en sigilo.',1)}
${it('c2','Sombra','No oye nada, pero te siente de cerca. Aparece desde los 150 m.',1)}
${it('med','Medusa','Quema al tocarla. Rodéala.',1)}</div></section>
<section><h3>Objetos</h3><div class="items">
${it('faro','Faro','Tu salida de cada tramo. Desde los 120 m puede estar sellado.')}
${it('cri','Cristal','Actívalos en orden (los puntos marcan el número). Brillan de lejos, tintinean tantas veces como su número y tus pings los detectan tras la roca.')}
${it('a','Bolsa de aire','Te rellena el aire por completo.')}
${it('h','Reparación','Suma 1 al casco (máximo 3).')}
${it('v','Velocidad','Nadas un 40 % más rápido durante 10 s, pero haces más ruido.')}
${it('s','Escudo','Absorbe el próximo golpe.')}
${it('q','Silencio','Durante 14 s nada de lo que hagas hace ruido.')}
${it('d','Señuelo','Pulsa F para lanzar un ruido lejos que atrae a las criaturas.')}
${it('p','Perla de coral','Solo en el arrecife: +1 de casco y algo de aire.')}
${it('m','Alga cartógrafa','Solo en el bosque de algas: revela la roca en un radio amplio.')}
${it('l','Luciérnaga','Solo en el jardín luminoso: 20 s viendo la roca a tu alrededor.')}
${it('b','Burbuja de fumarola','Solo en las fumarolas: mucho aire, pero hace ruido. Además, las fumarolas rugen y atraen a las criaturas.')}
${it('i','Cristal de hielo','Solo en las cavernas de hielo: tu próximo ping llega casi el doble de lejos.')}
${it('o','Concha','Solo en el cenagal: escudo y un señuelo.')}</div></section>
<section><h3>Profundidad</h3><ul class="dp">
<li><b>0 m</b><span>Cada inmersión cambia: aguas turbias, nidos, derrumbes lejanos…</span></li>
<li><b>60 m</b><span>Biomas: coral, algas, jardín luminoso, fumarolas, hielo y cenagal. Cada uno cambia las reglas y una zona puede mezclar varios.</span></li>
<li><b>90 m</b><span>Pueden aparecer reparaciones de casco.</span></li>
<li><b>120 m</b><span>El faro puede estar sellado: hay que activar los cristales.</span></li>
<li><b>150 m</b><span>Acecha la Sombra.</span></li>
<li><b>240 m</b><span>Desaparecen las flechas guía (la dorada hacia el faro y la azul hacia el cristal). Solo te queda el oído.</span></li></ul></section>
<section><h3>Cooperativo online</h3><div class="items">
${it('btn','Botones del faro','Hay uno por buceador vivo. Hay que pulsarlos a la vez (quedándote encima). Al abrirse, el faro queda abierto.')}
${it('tw','Cristales gemelos','Dos cristales lejanos: enciende uno y que otro buceador toque el otro en menos de 7 s. Recompensa: aire y balizas.')}
${it('f','Baliza','Todo el equipo ve a sus compañeros durante 20 s.')}
${it('e','Eco de equipo','Revela la roca alrededor de donde lo cogiste, para todos.')}</div>
<div class="steps"><div class="step"><b>Si caes</b>Tienes 20 s: un compañero debe quedarse a tu lado unos 3 s para reanimarte. Si no, espectas y vuelves dos profundidades después.</div>
<div class="step"><b>Compartir aire</b>Si un compañero casi no tiene aire, quédate pegado a él y le pasarás el tuyo (hace algo de ruido).</div>
<div class="step"><b>Aviso silencioso</b>Pulsa Q (o Aviso en móvil) para marcar dónde estás. No hace ruido y tus compañeros ven la marca.</div>
<div class="step"><b>Solo se pasa de nivel</b>cuando todos los que siguen vivos han llegado al faro. Verás a tus compañeros únicamente cuando tu eco los alcance. Las partidas cooperativas no cuentan para la clasificación.</div></div></section>
<p class="tip">Todo lo que haces suena. Nadar rápido y los pings fuertes atraen a las criaturas; el sigilo te hace casi invisible.</p>
</div>`;
const mi=(a,t,c)=>`<button class="mi ${c||''}" type="button" data-act="${a}"><i></i>${t}</button>`;
const sl=(k,t)=>`<label for="v-${k}">${t}</label><output>${Math.round(set[k]*100)}%</output><input id="v-${k}" data-k="${k}" type="range" min="0" max="1" step=".05" value="${set[k]}">`;
let deadMsg='';
function showOverlay(kind,msg){deadMsg=msg||'';overlay.hidden=false;overlay.dataset.kind=kind;view='main';render(kind,msg)}
function render(kind,msg){
  if(msg==null)msg=deadMsg;
  let h='';
  if(view==='how')h=howHtml+mi('back','Volver','back');
  else if(view==='set')h=`<div class="sub">Ajustes</div><h2>Sonido y pantalla</h2><div class="set">${sl('master','Volumen general')}${sl('music','Música y ambiente')}${sl('sfx','Efectos')}</div><label class="chk"><input type="checkbox" data-k="calm" ${set.calm?'checked':''}>Reducir destellos y pulsos rojos</label><button class="lnk" type="button" data-act="clear">Borrar récord</button>${mi('back','Volver','back')}`;
  else if(AV[view])h=AV[view]();
  else if(kind==='menu')h=`<h1>EC<span class="o">O</span></h1><p>Una cueva inundada, sin una gota de luz. Lanzas pulsos de sonar y la roca te devuelve su forma. Lo que vive aquí no ve, pero oye todo lo que haces.</p><nav class="menu" aria-label="Menú principal">${mi('play','Sumergirse','pri')}${mi('tut','Tutorial')}${mi('how','Cómo jugar')}${sb?mi('rank','Clasificación'):''}${mi('set','Ajustes')}${mi(sb?(usr?'acct':'login'):'nocfg',usr&&prof?'Mi perfil':'Cuenta')}</nav>${(usr&&prof)||best?`<div class="sub">${usr&&prof?esc(prof.username)+(best?' · ':''):''}${best?'Récord: '+best*30+' m':''}</div>`:''}`;
  else if(kind==='pause')h=`<div class="sub">En pausa</div><h2>${coop?'Tus compañeros siguen nadando':'El agua sigue quieta'}</h2><nav class="menu">${mi('resume','Continuar','pri')}${mi('how','Cómo jugar')}${mi('set','Ajustes')}${mi('quit','Salir al menú')}</nav>`;
  else if(kind==='dead')h=`<div class="sub">Fin de la inmersión</div><h2>${msg}</h2><p>Llegaste a ${dive*30} m. Tu mejor marca es ${best*30} m.</p><nav class="menu">${mi('solo','Volver a bajar','pri')}${sb?mi('rank','Clasificación'):''}${mi('quit','Menú principal')}</nav>`;
  else if(kind==='tutend')h=`<div class="sub">Tutorial completado</div><h2>Ya sabes lo básico</h2><p>Cristales, medusas, biomas y las demás criaturas los irás encontrando al bajar. Tienes el resumen en «Cómo jugar».</p><nav class="menu">${mi('play','Sumergirse','pri')}${mi('tut','Repetir tutorial')}${mi('how','Cómo jugar')}${mi('quit','Menú principal')}</nav>`;
  if(kind==='dead'&&lastCoop&&!AV[view]&&view!=='how'&&view!=='set')h=`<div class="sub">Fin de la inmersión</div><h2>${msg}</h2><p>El equipo llegó a ${dive*30} m. Las partidas cooperativas no cuentan para tu récord ni para la clasificación.</p><nav class="menu">${mi('quit','Menú principal','pri')}</nav>`;
  card.className=view==='how'?'card wide':'card';card.innerHTML=h;drawIcons();if(view==='rank')loadRank();const f=card.querySelector(matchMedia('(pointer:fine)').matches?'input:not([type=range]):not([type=checkbox]),.mi':'.mi');if(f)try{f.focus({preventScroll:true})}catch(e){}
}
function act(a,el){
  const k=overlay.dataset.kind;
  if(a==='back'||a==='how'||a==='set'){uiTick();view=a==='back'?'main':a;render(k)}
  else if(a==='play'){if(sb){uiTick();view='mode';render(k)}else startGame()}
  else if(a==='solo'){lastCoop=false;startGame()}
  else if(a==='coopgo'){uiTick();roomErr='';view=usr&&prof?'coop':'login';render(k)}
  else if(a==='mkroom'){uiTick();openRoom(genCode(),true)}
  else if(a==='gostart')hostStart();
  else if(a==='leave'){uiTick();leaveRoom();roomErr='';view='coop';render(k)}
  else if(a==='tut')startTutorial();
  else if(a==='resume')resume();
  else if(a==='quit'){uiTick();toMenu()}
  else if(AV[a]){uiTick();view=a;render(k)}
  else if(a==='logout')doLogout();
  else if(a==='del')doDelete(el);
  else if(a==='clear'){best=0;try{localStorage.removeItem('eco-best')}catch(e){}cloudSave();uiTick();el.textContent='Récord borrado'}
}
card.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b)});
card.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;
  if(t.type==='checkbox')set[k]=t.checked;else{set[k]=+t.value;t.previousElementSibling.textContent=Math.round(t.value*100)+'%';uiTick()}
  saveSet();applyVol()});
/* ---------- cuentas (Supabase) ---------- */
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb=null,usr=null,prof=null,cloudT=0;
if(SUPABASE_URL&&SUPABASE_KEY&&window.supabase){try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{realtime:{params:{eventsPerSecond:40}}})}catch(e){}}
function cloudSave(){if(!sb||!usr||!prof)return;clearTimeout(cloudT);cloudT=setTimeout(async()=>{try{await sb.from('profiles').update({best,settings:set}).eq('id',usr.id)}catch(e){}},700)}
function refresh(){if(!overlay.hidden&&overlay.dataset.kind==='menu'&&(view==='main'||view==='acct'))render('menu')}
async function loadProfile(){
  const u=usr;if(!sb||!u)return;
  try{
    let {data}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
    if(!data){const m=u.user_metadata||{};
      ({data}=await sb.from('profiles').insert({id:u.id,username:String(m.username||String(u.email).split('@')[0]).padEnd(3,'_').slice(0,20),best,settings:set}).select().single())}
    if(!data||!usr||usr.id!==u.id)return;
    prof=data;
    if(data.settings&&Object.keys(data.settings).length)Object.assign(set,data.settings);
    if(best>data.best)cloudSave();else best=data.best;
    try{localStorage.setItem('eco-set',JSON.stringify(set));localStorage.setItem('eco-best',String(best))}catch(e){}
    applyVol();refresh();
  }catch(e){}
}
function wipeLocal(){best=0;Object.assign(set,{master:.8,music:.6,sfx:.9,calm:false});try{localStorage.removeItem('eco-best');localStorage.removeItem('eco-set')}catch(e){}applyVol()}
async function endSession(){clearTimeout(cloudT);try{await sb.auth.signOut()}catch(e){}usr=prof=null;wipeLocal();view='main';render('menu')}
async function doLogout(){uiTick();if(prof){try{await sb.from('profiles').update({best,settings:set}).eq('id',usr.id)}catch(e){}}endSession()}
async function doDelete(el){
  if(!el.dataset.c){el.dataset.c=1;el.textContent='Pulsa otra vez: se borrará para siempre';return}
  const {error}=await sb.rpc('delete_my_account');
  if(error){delete el.dataset.c;el.textContent='No se pudo eliminar. Inténtalo de nuevo';return}
  endSession();
}
async function loadRank(){
  const box=()=>view==='rank'?document.getElementById('lb'):null;
  const put=h=>{const b=box();if(b)b.innerHTML=h};
  if(!sb)return put('<p class="lbn">Clasificación no disponible.</p>');
  if(cloudT){clearTimeout(cloudT);cloudT=0;if(usr&&prof){try{await sb.from('profiles').update({best,settings:set}).eq('id',usr.id)}catch(e){}}}
  try{
    const [top,me]=await Promise.all([sb.rpc('get_leaderboard',{lim:10}),usr?sb.rpc('get_my_rank'):Promise.resolve({data:null})]);
    if(top.error)throw top.error;
    const rows=top.data||[];
    if(!rows.length)return put('<p class="lbn">Aún no hay nadie en la clasificación. ¡Sé el primero en sumergirte!</p>');
    const li=r=>`<li class="${r.is_me?'me':''}"><span class="rk">${String(r.rank).padStart(2,'0')}</span><span class="nm">${esc(r.username)}</span><span class="sc">${r.best*30} m</span></li>`;
    let h='<ol class="lb">'+rows.map(li).join('');
    const m=me&&me.data&&(Array.isArray(me.data)?me.data[0]:me.data);
    if(m&&!rows.some(r=>r.is_me))h+='<li class="gap">···</li>'+li({...m,is_me:true});
    h+='</ol>';
    if(!usr)h+='<p class="lbn" style="margin-top:12px">Inicia sesión para aparecer en la clasificación.</p>';
    put(h);
  }catch(e){put('<p class="lbn">No se pudo cargar la clasificación. Inténtalo de nuevo.</p>')}
}
const eTxt=e=>{const m=String(e&&e.message||e);return /invalid login/i.test(m)?'Correo o contraseña incorrectos.':/not confirmed/i.test(m)?'Confirma primero tu correo.':/already registered/i.test(m)?'Ya existe una cuenta con ese correo.':/rate limit|too many/i.test(m)?'Demasiados intentos. Espera un poco.':/network|fetch/i.test(m)?'Sin conexión con el servidor.':/same password|different from the old/i.test(m)?'La contraseña nueva debe ser distinta.':/password/i.test(m)?'Contraseña no válida (mínimo 8 caracteres).':'No se pudo completar. Inténtalo de nuevo.'};
const note=t=>{const m=card.querySelector('.msg');if(m){m.textContent=t;m.className='msg ok'}};
const fld=(n,l,t,ac,v)=>`<label class="fld"><span>${l}</span><input name="${n}" type="${t}" autocomplete="${ac}" ${v?`value="${esc(v)}"`:''} required></label>`;
const nm=()=>prof?prof.username:(usr&&usr.user_metadata&&usr.user_metadata.username)||'Buceador';
const AV={
  mode:()=>`<div class="sub">Sumergirse</div><h2>¿Cómo bajas?</h2><nav class="menu">${mi('solo','En solitario','pri')}${mi('coopgo','Cooperativo online')}</nav><p class="lbn">${usr&&prof?'De 2 a 4 buceadores. Aire y casco son individuales; el faro se abre entre todos.':'El cooperativo online requiere iniciar sesión.'}</p>${mi('back','Volver','back')}`,
  coop:()=>`<div class="sub">Cooperativo online</div><h2>Bajad juntos</h2>${roomErr?`<p class="msg">${esc(roomErr)}</p>`:''}<nav class="menu">${mi('mkroom','Crear una sala','pri')}</nav><div class="acc"><form data-f="join"><label class="fld"><span>Código de sala</span><input name="code" type="text" autocomplete="off" autocapitalize="characters" maxlength="4" style="text-transform:uppercase;letter-spacing:.3em" required></label><p class="msg"></p><button class="mi" type="submit"><i></i>Unirse</button></form></div>${mi('mode','Volver','back')}`,
  conn:()=>`<div class="sub">Cooperativo online</div><h2>Conectando…</h2><p>Sala ${esc(roomCode)}</p>${mi('leave','Cancelar','back')}`,
  lobby:()=>`<div class="sub">Sala</div><h2 class="code">${esc(roomCode)}</h2><p class="lbn">Comparte este código · ${roster.length}/4 buceadores</p><ol class="lb">${roster.map(r=>`<li class="${r.id===myId?'me':''}"><span class="rk">${r.host?'★':'·'}</span><span class="nm">${esc(r.name)}</span><span class="sc">${r.id===myId?'tú':''}</span></li>`).join('')}</ol>${isHost?`<nav class="menu"><button class="mi pri" type="button" data-act="gostart" ${roster.length<2?'disabled':''}><i></i>${roster.length<2?'Esperando buceadores (mín. 2)':'Empezar la inmersión'}</button></nav>`:'<p class="lbn" style="margin-top:12px">Esperando a que el anfitrión empiece…</p>'}${mi('leave','Salir de la sala','back')}`,
  rank:()=>`<div class="sub">Clasificación</div><h2>Los más profundos</h2><p class="lbn">Solo cuenta el modo en solitario: el cooperativo no puntúa.</p><div id="lb"><p class="lbn">Cargando…</p></div>${mi('back','Volver','back')}`,
  nocfg:()=>`<div class="sub">Cuenta</div><h2>Cuentas no disponibles</h2><p>${SUPABASE_URL&&SUPABASE_KEY?'No se pudo cargar el servicio de cuentas. Comprueba tu conexión y recarga la página.':'Falta configurar Supabase: pon tu URL y tu clave anon en SUPABASE_URL y SUPABASE_KEY, al inicio del script.'}</p>${mi('back','Volver','back')}`,
  login:()=>`<div class="sub">Cuenta</div><h2>Identifícate</h2><p>Guarda tus ajustes y tu récord de profundidad y llévalos a cualquier dispositivo.</p><div class="acc"><form data-f="login">${fld('email','Correo','email','email')}${fld('password','Contraseña','password','current-password')}<p class="msg"></p><button class="mi pri" type="submit"><i></i>Entrar</button></form><nav class="menu">${mi('signup','Crear una cuenta')}${mi('forgot','Olvidé mi contraseña')}</nav></div>${mi('back','Volver','back')}`,

card.addEventListener('submit',async e=>{
  e.preventDefault();if(!sb)return;
  const f=e.target,d=Object.fromEntries(new FormData(f)),m=f.querySelector('.msg'),b=f.querySelector('[type=submit]'),em=(d.email||'').trim(),n=(d.username||'').trim();
  const say=(t,ok)=>{m.textContent=t;m.className='msg'+(ok?' ok':'')};
  b.disabled=true;say('');
  try{
    switch(f.dataset.f){
      case'login':{const {data,error}=await sb.auth.signInWithPassword({email:em,password:d.password});if(error)throw error;usr=data.user;await loadProfile();uiOk();view='acct';render('menu');break}
      case'signup':{
        if(n.length<3||n.length>20)return say('El nombre debe tener entre 3 y 20 caracteres.');
        if(d.password.length<8)return say('La contraseña necesita al menos 8 caracteres.');
        const {data,error}=await sb.auth.signUp({email:em,password:d.password,options:{data:{username:n},emailRedirectTo:location.href.split('#')[0]}});
        if(error)throw error;
        if(data.user&&data.user.identities&&!data.user.identities.length)throw new Error('already registered');
        uiOk();
        if(data.session){usr=data.user;await loadProfile();view='acct';render('menu')}
        else say('Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.',1);
        break}
      case'join':{const c=(d.code||'').trim().toUpperCase();if(c.length!==4)return say('El código tiene 4 caracteres.');roomErr='';openRoom(c,false);break}
      case'forgot':{const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});if(error)throw error;uiOk();say('Si ese correo tiene cuenta, recibirás un enlace para restablecer la contraseña.',1);break}
      case'name':{
        if(n.length<3||n.length>20)return say('El nombre debe tener entre 3 y 20 caracteres.');
        const {error}=await sb.from('profiles').update({username:n}).eq('id',usr.id);if(error)throw error;
        if(prof)prof.username=n;uiOk();render('menu');note('Nombre actualizado.');break}
      case'pass':{
        if(d.password.length<8)return say('La contraseña necesita al menos 8 caracteres.');
        if(d.password!==d.again)return say('Las contraseñas no coinciden.');
        const {error}=await sb.auth.updateUser({password:d.password});if(error)throw error;
        uiOk();view='acct';render('menu');note('Contraseña actualizada.');break}
    }
  }catch(x){say(eTxt(x))}

        shareT-=dt;if(shareT<=0){shareT=.6;emitNoise(p.x,p.y,4,'move')}
        if(revT[q.id]>=3&&time-q.rs>2){q.rs=time;revT[q.id]=0;q.rev=0;net('rev',{to:q.id});toast('Has reanimado a '+q.name,2500);tone({f0:400,f1:900,dur:.4,vol:.1})}
      }else{revT[q.id]=0;q.rev=0}
    }else if(q.s==='a'&&q.o2<.3&&d<1.5&&p.o2>p.o2max*.4){
      p.o2-=dt*5;shareAcc+=dt*5;
      shareT-=dt;if(shareT<=0){shareT=.6;emitNoise(p.x,p.y,3.5,'move');toast('Compartes aire con '+q.name,1200)}
      if(shareAcc>=2.5){net('air',{to:q.id,a:+shareAcc.toFixed(2)});shareAcc=0}
    }
  }
}
function hostSnap(){
  const tg=[];if(my.s==='a')tg.push(p);for(const q of peerArr())if(q.s!=='x'&&q.dv===dive)tg.push(q);
  const l=[];
  creatures.forEach((c,i)=>{
    const code=c.state==='hunt'?1:c.state==='search'?2:0,age=time-(c.lt||-99);
    if(code===0&&code===c.ls&&age<.35)return;
    let near=false;for(const q of tg)if(Math.hypot(q.x-c.x,q.y-c.y)<12){near=true;break}
    if(!near){
      const mv=c.lx==null?9:Math.hypot(c.x-c.lx,c.y-c.ly);
      if(!(code!==c.ls||c.lt==null||(age>=1&&mv>.3)||age>=4))return;
    }
    const dtm=Math.max(.05,age>50?.2:age),vx=c.lx==null?0:(c.x-c.lx)/dtm,vy=c.lx==null?0:(c.y-c.ly)/dtm;
    c.lx=c.x;c.ly=c.y;c.lt=time;c.ls=code;
    l.push([i,+c.x.toFixed(2),+c.y.toFixed(2),code,+vx.toFixed(1),+vy.toFixed(1)]);
  });
  if(l.length)net('cr',{dv:dive,c:l});
}
function hostLogic(){
  if(state!=='play'||time<advLock||overSent)return;
  const al=aliveList();
  if(!al.length){overSent=true;net('over',{dv:dive});endCoop('Todo el equipo ha caído.');return}
  if(btns.length&&!gate.open){
    const set=new Set();for(const q of al)if(q.btn>=0)set.add(q.btn);
    const req=Math.max(1,Math.min(btns.length,al.length));
    if(set.size!==gate.on||req!==gate.req){gate.on=set.size;gate.req=req;net('gp',{on:gate.on,req,dv:dive})}
    if(set.size>=req){net('gate',{dv:dive});gateOpen()}
  }
  if(al.every(q=>q.ex)){
    const nv=dive+1,n=aliveAfter(nv);net('next',{dv:nv,n});doNext(nv,n);
  }
}
function aliveAfter(nv){
  let n=0;const st=(s2,dd)=>{if(s2==='d'){s2='x';dd=dive}return s2==='a'||(s2==='x'&&nv>=dd+2)};
  if(st(my.s,my.dd))n++;for(const q of peerArr())if(st(q.s,q.dd))n++;
  return Math.max(1,n);
}

/* ---- dibujo y HUD cooperativo ---- */
function lbl(t,px,py,col,sz){
  ctx.save();ctx.font='500 '+Math.round(S*(sz||.55))+'px "IBM Plex Mono",ui-monospace,monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=3;ctx.strokeStyle='rgba(3,8,12,.85)';ctx.fillStyle=col;ctx.strokeText(t,px,py);ctx.fillText(t,px,py);ctx.restore();
}
function edgeArrow(ang,col,al){
  const rr=Math.min(vw,vh)*.36,ax=vw/2+Math.cos(ang)*rr,ay=vh/2+Math.sin(ang)*rr;
  ctx.save();ctx.translate(ax,ay);ctx.rotate(ang);ctx.fillStyle=`rgba(${col},${clamp(al,0,1).toFixed(3)})`;
  ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-9);ctx.lineTo(-3,0);ctx.lineTo(-8,9);ctx.closePath();ctx.fill();ctx.restore();
}
function drawBtnIco(c,px,py,r,on){
  c.strokeStyle=on?'rgba(255,211,106,.95)':'rgba(110,255,200,.9)';c.lineWidth=1.6;c.beginPath();c.arc(px,py,r,0,6.283);c.stroke();
  c.fillStyle=on?'rgba(255,211,106,.9)':'rgba(110,255,200,.3)';c.beginPath();c.arc(px,py,r*.48,0,6.283);c.fill();
}
function drawTwinIco(c,px,py,r){
  for(const dx of[-.55,.55]){const x=px+dx*r;c.fillStyle='rgba(215,140,255,.9)';c.beginPath();c.moveTo(x,py-r*.8);c.lineTo(x+r*.5,py);c.lineTo(x,py+r*.8);c.lineTo(x-r*.5,py);c.closePath();c.fill()}
  c.strokeStyle='rgba(230,170,255,.6)';c.lineWidth=1;c.beginPath();c.moveTo(px-r*.2,py);c.lineTo(px+r*.2,py);c.stroke();
}
function drawCoopObjs(ox,oy){
  for(const b of btns){
    if(!b.known&&!b.on)continue;
    const px=ox+b.x*S,py=oy+b.y*S,pu=.6+.4*Math.sin(time*3+b.i),on=b.on||gate.open;
    ctx.lineWidth=2;ctx.strokeStyle=on?'rgba(255,211,106,.95)':`rgba(110,255,200,${(.5+.35*pu).toFixed(3)})`;ctx.beginPath();ctx.arc(px,py,S*.42,0,6.283);ctx.stroke();
    ctx.fillStyle=on?'rgba(255,211,106,.9)':'rgba(110,255,200,.28)';ctx.beginPath();ctx.arc(px,py,S*.2,0,6.283);ctx.fill();
  }
  for(const t of twins){
    if(!t.known)continue;
    const px=ox+t.x*S,py=oy+t.y*S,r=S*.34,lit=t.lit>0,pu=.6+.4*Math.sin(time*3+t.k);
    ctx.fillStyle=lit?'rgba(255,230,255,.98)':'rgba(215,140,255,.85)';ctx.beginPath();ctx.moveTo(px,py-r);ctx.lineTo(px+r*.7,py);ctx.lineTo(px,py+r);ctx.lineTo(px-r*.7,py);ctx.closePath();ctx.fill();
    ctx.strokeStyle=`rgba(230,170,255,${(lit?.9:.25+.4*pu).toFixed(3)})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(px,py,S*(.7+.3*pu),0,6.283);ctx.stroke();
    if(lit&&!twDone&&t.lit<8)lbl(String(Math.ceil(t.lit)),px,py+S*.95,'rgba(255,230,255,.95)',.5);
  }
  for(const m of marks){
    const px=ox+m.x*S,py=oy+m.y*S,pu=.6+.4*Math.sin(time*5),a=Math.min(1,m.t/2);
    ctx.strokeStyle=`rgba(255,190,80,${(.9*a).toFixed(3)})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py,S*(.55+.25*pu),0,6.283);ctx.stroke();
    lbl('!',px,py,`rgba(255,190,80,${a.toFixed(3)})`,.8);lbl(m.name,px,py-S*1.05,`rgba(255,190,80,${a.toFixed(3)})`,.5);
  }
}
function drawPeers(ox,oy){
  const spec=my.s==='x';
  for(const q of peerArr()){
    if(q.dv!==dive||q.s==='x'||q.s==='l')continue;
    const al=(spec||baliza>0)?1:clamp(q.vis/.9,0,1);if(al<=.01)continue;
    const px=ox+q.x*S,py=oy+q.y*S,col=pcol(q.id);
    ctx.save();ctx.globalAlpha=al;
    const g=ctx.createRadialGradient(px,py,0,px,py,S*1.1);g.addColorStop(0,'rgba(200,245,255,.22)');g.addColorStop(1,'rgba(200,245,255,0)');ctx.fillStyle=g;ctx.fillRect(px-S*1.2,py-S*1.2,S*2.4,S*2.4);
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(px,py,S*.26,0,6.283);ctx.fill();
    if(q.s==='d'){
      ctx.strokeStyle='rgba(255,96,74,.95)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py,S*.5,0,6.283);ctx.moveTo(px-S*.2,py-S*.2);ctx.lineTo(px+S*.2,py+S*.2);ctx.moveTo(px+S*.2,py-S*.2);ctx.lineTo(px-S*.2,py+S*.2);ctx.stroke();
      if(q.rev>0){ctx.strokeStyle='rgba(125,255,192,.95)';ctx.beginPath();ctx.arc(px,py,S*.68,-1.57,-1.57+6.283*clamp(q.rev,0,1));ctx.stroke()}
      lbl(peerDn(q)+' s',px,py+S*1.05,'rgba(255,120,100,.95)',.5);
    }else if(q.ex){ctx.strokeStyle='rgba(255,211,106,.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(px,py,S*.5,0,6.283);ctx.stroke()}
    lbl(q.name,px,py-S*1.8,col);
    ctx.restore();
  }
  if(state==='play'&&my.s!=='x'){
    const px=ox+p.x*S,py=oy+p.y*S;
    if(my.s==='d'){ctx.strokeStyle='rgba(255,96,74,.95)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py,S*.5,0,6.283);ctx.moveTo(px-S*.2,py-S*.2);ctx.lineTo(px+S*.2,py+S*.2);ctx.moveTo(px+S*.2,py-S*.2);ctx.lineTo(px-S*.2,py+S*.2);ctx.stroke()}
    else if(my.ex){ctx.strokeStyle='rgba(255,211,106,.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(px,py,S*.5,0,6.283);ctx.stroke()}
    lbl(myName,px,py-S*1.8,pcol(myId));
  }
}
function drawCoopArrows(){
  if(state!=='play'||my.s==='x')return;
  for(const q of peerArr()){
    if(q.s!=='d'||q.dv!==dive||my.s!=='a')continue;
    const d=Math.hypot(q.x-p.x,q.y-p.y);if(d>3)edgeArrow(Math.atan2(q.y-p.y,q.x-p.x),'255,96,74',Math.min(1,(d-3)/5)*(.7+.25*Math.sin(time*6)));
  }
  for(const m of marks){const d=Math.hypot(m.x-p.x,m.y-p.y);if(d>5)edgeArrow(Math.atan2(m.y-p.y,m.x-p.x),'255,190,80',Math.min(1,(d-5)/6)*Math.min(1,m.t/2)*.9)}
  if(my.s==='a'&&level<=ARROW_MAX&&!gate.open&&!my.ex){
    const b=btns.filter(k=>!k.on).sort((a,c)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(c.x-p.x,c.y-p.y))[0];
    if(b){const d=Math.hypot(b.x-p.x,b.y-p.y);if(d>6)edgeArrow(Math.atan2(b.y-p.y,b.x-p.x),'110,255,200',Math.min(1,(d-6)/8)*(.6+.25*Math.sin(time*3)))}
  }
}
let lastTeam='';
function coopHud(){
  const t=$('team'),sp=$('spec');
  if(!coop){if(lastTeam){t.textContent='';lastTeam=''}sp.hidden=true;return}
  const rows=roster.map(r=>{
    const mine=r.id===myId,q=mine?null:peers[r.id],st=mine?my.s:(q?q.s:'x'),dn=mine?Math.ceil(Math.max(0,my.down)):(q?peerDn(q):0),ex=mine?my.ex:(q&&q.ex);
    const tx=st==='d'?'cae '+dn+' s':st==='x'?'espera':ex?'en el faro':'';
    return `<span class="tm ${st}" style="--c:${pcol(r.id)}"><i></i>${esc(r.name)}${tx?` <b>${tx}</b>`:''}</span>`;
  }).join('');
  const gt=gate.open?'<span class="tm gate on">Faro abierto</span>':btns.length?`<span class="tm gate">Botones ${gate.on}/${gate.req}</span>`:'';
  const h=rows+gt;if(h!==lastTeam){lastTeam=h;t.innerHTML=h}
  let msg='';
  if(my.s==='d')msg=`Has caído · ${Math.ceil(Math.max(0,my.down))} s<small>Un compañero puede reanimarte si se queda a tu lado</small>`;
  else if(my.s==='x'){const q=peers[specId];msg=`Espectando${q?' a '+esc(q.name):''}<small>A / D o toca la pantalla para cambiar · vuelves en ${Math.max(1,my.dd+2-dive)} profundidad(es)</small>`}
  if(msg){if(sp.dataset.m!==msg){sp.dataset.m=msg;sp.innerHTML=msg}sp.hidden=false}else{sp.hidden=true;sp.dataset.m=''}
}

/* ---------- bucle ---------- */
let last=performance.now(),drawAcc=0,slowT=0,slowN=0;
function frame(now){
  const rd=(now-last)/1000,dt=Math.min(.05,rd);last=now;time+=dt;
  if(state==='play'&&!document.hidden){slowT+=dt;if(rd>.03)slowN++;if(slowT>3){if(slowN>slowT*24&&dprCap>1){dprCap=Math.max(1,dprCap-.25);resize()}slowT=slowN=0}}
  if(state==='play'){
    updPlayer(dt);
    if(state==='play'){
      lvT+=dt;if(coop)coopTick(dt);
      if(tut)tutTick(dt);for(const c of creatures)updCreature(c,dt);
      for(const j of jellies){j.a=j.a0+lvT*.8;j.x=j.hx+Math.cos(j.a)*.9;j.y=j.hy+Math.sin(j.a*1.3)*.9;if(state==='play'&&p.inv<=0&&Math.hypot(j.x-p.x,j.y-p.y)<.7)hurt(j,.7)}
      for(let i=pings.length-1;i>=0;i--){updPing(pings[i],dt);if(pings[i].r>pings[i].max+1)pings.splice(i,1)}
    }
  }else if(state==='intro'){
    introT-=dt;if(introT<=0)state='play';
    if(coop)coopTick(dt);
  }else if(state==='menu'){
    menuT-=dt;if(menuT<=0){demoPing();menuT=3.6}
    for(let i=pings.length-1;i>=0;i--){updPing(pings[i],dt);if(pings[i].r>pings[i].max+1)pings.splice(i,1)}
  }
  cam.x+=(p.x-cam.x)*Math.min(1,dt*6);cam.y+=(p.y-cam.y)*Math.min(1,dt*6);
  if(state==='menu'){cam.x=p.x+Math.sin(time*.13)*2.2;cam.y=p.y+Math.cos(time*.1)*1.4}
  if(document.body.dataset.s!==state)document.body.dataset.s=state;
  stingCool-=dt;revealCool-=dt;
  if(state==='play'){let tg=0;for(const c of creatures){if(time-c.revealT>=4)continue;if(c.state==='hunt')tg=Math.max(tg,.35+.65*clamp(1-Math.hypot(c.x-p.x,c.y-p.y)/20,0,1));else if(c.state==='search')tg=Math.max(tg,.4);else tg=Math.max(tg,.3)}
    fear+=(tg-fear)*Math.min(1,dt*(tg>fear?4:.4));
    if(!coop||isHost){eventT-=dt;if(eventT<=0){eventT=28+rnd()*30;randomEvent()}}}
  else fear+=(0-fear)*Math.min(1,dt*2);
  updAmbient(dt,state==='play'?threatLevel():0);musicTick();
  if(AC&&humGain){
    const d=Math.hypot(exit.x-p.x,exit.y-p.y),R=40+Math.max(0,5-level)*12,early=level<=3,v=state==='play'&&!(tut&&tut.i<6)?Math.pow(clamp(1-d/R,0,1),early?1.1:1.6)*(early?.3:.22):0;
    if(state==='play'&&level<=4&&!(tut&&tut.i<6)){beaconT-=dt;if(beaconT<=0){beaconT=4.5;if(d<R){const pn2=clamp((exit.x-p.x)/14,-1,1),bv=.025+.06*clamp(1-d/R,0,1);tone({f0:988,f1:988,dur:1.4,att:.04,vol:bv,pan:pn2,send:1});tone({f0:1480,f1:1480,dur:1.2,att:.04,vol:bv*.5,delay:.14,pan:pn2,send:1})}}}
    humT-=dt;if(humT<=0){humT=.08;humGain.gain.setTargetAtTime(v,AC.currentTime,.1);
    if(humPan)humPan.pan.setTargetAtTime(clamp((exit.x-p.x)/14,-1,1),AC.currentTime,.1)}
  }
  if(state==='play'&&AC&&crystals.length){const nk=crystals.find(k=>k.n===cNext+1&&!k.done);cbT-=dt;if(nk&&cbT<=0){cbT=3.4;const dk=Math.hypot(nk.x-p.x,nk.y-p.y);if(dk<48){const pn=clamp((nk.x-p.x)/14,-1,1),v=.03+.07*clamp(1-dk/48,0,1);for(let i=0;i<nk.n;i++)tone({f0:1760,f1:1700,dur:.22,vol:v,pan:pn,delay:i*.2,type:'triangle',send:.8})}}}
  tutPanel();updHud();if(coop||teamOn)coopHud();drawAcc+=dt;if(state==='play'||state==='intro'||drawAcc>=.033){draw(drawAcc);drawAcc=0}
  requestAnimationFrame(frame);
}
// fondo de menú: una cueva que se dibuja sola con pings
function demoPing(){const N=300,max=17,dist=new Float32Array(N),ca=new Float32Array(N),sa=new Float32Array(N);
  for(let i=0;i<N;i++){const an=i/N*6.283,c=Math.cos(an),sn=Math.sin(an);ca[i]=c;sa[i]=sn;let d=0,hit=false;while(d<max){d+=.08;if(solidAt(p.x+c*d,p.y+sn*d)){hit=true;break}}dist[i]=hit?d-.04:Infinity}
  pings.push({x:p.x,y:p.y,r:0,max,speed:9,N,dist,ca,sa,rev:new Uint8Array(N),seen:new Set()});tone({f0:1250,f1:520,dur:.4,vol:.06,send:.9})}
function menuScene(){const c=genCave();grid=c.g;resetMem();known=new Uint8Array(W*H);
  const i=c.cells[(c.cells.length/2)|0];p.x=cam.x=(i%W)+.5;p.y=cam.y=((i/W)|0)+.5;menuT=.6;genBiomes(c.cells,9)}
menuScene();
showOverlay('menu');updateHp();
requestAnimationFrame(frame);
window.__eco={get cp(){return {coop,isHost,my,peers,gate,btns,twins,twDone,dive,state,roster,marks,coopN,baliza,seed}},openRoom,genCode,pickups:()=>pickups,get state(){return state},p,get creatures(){return creatures},get exit(){return exit},firePing,startGame,get level(){return level}};
})();
